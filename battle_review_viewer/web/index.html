<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battle Review Viewer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Local Replay Review</p>
          <h1>Battle Review Viewer</h1>
          <p class="hero-copy">
            Kaggle の見返しやすさに寄せつつ、盤面と選択理由をローカルで追えるレビュー画面です。
          </p>
        </div>
        <div class="hero-actions">
          <label class="picker">
            <span>Replay</span>
            <select id="replaySelect"></select>
          </label>
          <button id="reloadButton" class="ghost">Reload List</button>
        </div>
      </section>

      <section class="toolbar">
        <div class="toolbar-group">
          <button id="prevButton">Prev</button>
          <button id="nextButton">Next</button>
          <button id="autoplayButton" class="accent">Autoplay</button>
        </div>
        <div class="toolbar-group">
          <label>
            Frame
            <input id="frameSlider" type="range" min="0" max="0" value="0" />
          </label>
        </div>
        <div id="frameMeta" class="frame-meta"></div>
      </section>

      <section class="layout">
        <section class="board-panel">
          <div class="board">
            <div class="board-center-mark"></div>

            <div class="player-lane opponent">
              <div class="lane-side lane-left">
                <div class="stat-card">
                  <div class="stat-label">Opponent Deck</div>
                  <div id="opponentDeckCount" class="stat-value">0</div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">Opponent Discard</div>
                  <div id="opponentDiscardCount" class="stat-value">0</div>
                </div>
              </div>
              <div class="lane-main">
                <div id="opponentActive" class="active-slot"></div>
                <div id="opponentBench" class="bench-row"></div>
              </div>
              <div class="lane-side lane-right">
                <div id="opponentPrize" class="prize-column"></div>
              </div>
            </div>

            <div class="status-ribbon">
              <div id="turnBadge" class="turn-badge">Turn ?</div>
              <div id="contextBadge" class="context-badge">Context ?</div>
            </div>

            <div class="player-lane self">
              <div class="lane-side lane-left">
                <div class="stat-card">
                  <div class="stat-label">Your Deck</div>
                  <div id="selfDeckCount" class="stat-value">0</div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">Your Discard</div>
                  <div id="selfDiscardCount" class="stat-value">0</div>
                </div>
              </div>
              <div class="lane-main">
                <div id="selfBench" class="bench-row"></div>
                <div id="selfActive" class="active-slot"></div>
              </div>
              <div class="lane-side lane-right">
                <div id="selfPrize" class="prize-column"></div>
              </div>
            </div>
          </div>

          <section class="hand-panel">
            <div class="panel-title-row">
              <h2>Player 0 Hand</h2>
              <span id="handCountBadge" class="count-badge">0 cards</span>
            </div>
            <div id="selfHand" class="hand-row"></div>
          </section>
        </section>

        <aside class="inspector">
          <section class="info-card">
            <h2>Replay Summary</h2>
            <dl id="summaryList" class="summary-list"></dl>
          </section>

          <section class="info-card">
            <h2>Chosen Action</h2>
            <div id="chosenAction" class="action-box">No action</div>
          </section>

          <section class="info-card">
            <h2>Available Options</h2>
            <ol id="optionsList" class="options-list"></ol>
          </section>

          <section class="info-card">
            <h2>Logs</h2>
            <div id="logsList" class="logs-list"></div>
          </section>
        </aside>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
